version: "2"
linters:
  enable:
    - errorlint
    - misspell
    - unconvert
    - gocritic
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (io.Closer).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*github.com/itxkarthik/jobhunt/internal/store.Store).Close
        - (*github.com/itxkarthik/jobhunt/internal/app.App).Close
        # Terminal output: a failed write to stdout isn't actionable.
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*text/tabwriter.Writer).Flush
    staticcheck:
      checks: ["all", "-QF1001", "-ST1000", "-ST1003"]
