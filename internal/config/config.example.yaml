# Copy to ~/.config/jobhunt/config.yaml (or run `jobhunt config init`).
# API keys can also come from env vars: JOBHUNT_ADZUNA_APP_ID, JOBHUNT_ADZUNA_APP_KEY,
# JOBHUNT_JSEARCH_API_KEY, JOBHUNT_X_BEARER_TOKEN, JOBHUNT_WEBHOOK_URL, JOBHUNT_WEBHOOK_SECRET,
# JOBHUNT_SERVE_TOKEN.

user_agent: "jobhunt/0.1 (+https://github.com/itxkarthik/jobhunt; personal job search)"
cache_ttl: 1h      # don't refetch a source within this window
timeout: 20s       # per-source fetch timeout
# db_path: ~/.local/share/jobhunt/jobhunt.db
# keywords_file: ~/.config/jobhunt/keywords.yaml
# companies_file: ~/.config/jobhunt/companies.yaml   # replaces the built-in board list if present

defaults:
  countries: [IN]
  # modes: [remote, hybrid, onsite]
  # types: [internship, new-grad]
  # areas: [backend, systems]
  limit: 50

# Max points per score component (0–100 total).
ranking:
  match: 35    # keywords/areas
  recency: 25  # halves every 7 days
  level: 25    # internship/new-grad/entry-level
  fit: 10      # country/mode
  info: 5      # salary/visa given

sources:
  adzuna:
    enabled: false # paid: new keys get 25 trial calls, full access is £8/month
    app_id: ""     # https://developer.adzuna.com/signup
    app_key: ""
    max_pages: 2   # 50 results per page
  remotive:
    enabled: true  # TTL is forced to >= 6h by Remotive's terms
  remoteok:
    enabled: true
  arbeitnow:
    enabled: true
    max_pages: 2   # 300 jobs per page; only used for EU/remote searches
  himalayas:
    enabled: true
    max_pages: 5   # 20 jobs per page per country
  wwr:
    enabled: true
  hn:
    enabled: true
  greenhouse:
    enabled: true
  lever:
    enabled: true
  ashby:
    enabled: true
  workable:
    enabled: true
  recruitee:
    enabled: true
  jsearch:
    enabled: false # freemium; brings in LinkedIn/Indeed via Google Jobs
    api_key: ""    # OpenWeb Ninja key (ak_…, https://www.openwebninja.com) or RapidAPI key
    # ttl: 24h     # 1 request per country per refresh; raise to save a small free quota
    max_pages: 1
  x:
    enabled: false # pay-per-use (~$0.005 per post read)
    bearer_token: ""
    max_results: 25

# Headless mode: `jobhunt feed --webhook` (or with webhook_url set) POSTs
# each run's NDJSON batch here. Prefer the env vars for both values.
feed:
  # webhook_url: "https://example.com/hooks/jobhunt"
  # webhook_secret: ""   # >= 16 chars; signs requests (X-Jobhunt-Signature)

# Local web UI and API: `jobhunt serve`. Every /api request needs the bearer
# token. By default a random one is generated and printed at startup; set
# one here or in JOBHUNT_SERVE_TOKEN (>= 16 chars) for a stable token.
serve:
  # token: ""

# Company importers: `jobhunt companies import <name>` fills the companies
# list from official sources. Each stays off until configured.
importers:
  edgar:
    # SEC Form D filings (US funding rounds). EDGAR asks every client to
    # name who runs it with a contact email; it's sent only to sec.gov.
    # user_agent: "Your Name you@example.com"   # or JOBHUNT_EDGAR_USER_AGENT
    # industries: [Computers, Telecommunications, Other Technology, Other]
    # all_entities: false   # true keeps LLCs and LPs (mostly funds)
