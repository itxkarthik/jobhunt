# Company job boards queried directly through their ATS's public API.
# Every slug was checked live on 2026-10-24 (startups added 2026-11-13). Run `jobhunt sources --check-boards`
# to find stale ones.
#
# To customize, copy this file to ~/.config/jobhunt/companies.yaml; that file
# replaces this list entirely.
#
#   ats:       greenhouse | lever | ashby | workable | recruitee
#   slug:      the board id in the API URL
#   countries: where they hire (ISO codes). A board is only fetched when the
#              search includes one of these, or `remote-global` if remote: true.

